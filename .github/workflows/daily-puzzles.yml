name: Daily puzzles

# Every Sunday (and on demand) make sure the next 30 days of puzzles exist, then publish them.
# make_daily.py skips dates that already exist, so a normal week only generates ~7 days (roughly 10 to 40 minutes).
on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to make"
        default: "30"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install wordfreq english-words faker

      - name: Lint the clue bank
        run: python3 lint_bank.py clue_bank.txt

      - name: Generate missing days
        run: python3 make_daily.py --start "$(date -u +%F)" --days "${{ inputs.days || 30 }}" --out-dir daily -q

      - name: Validate every puzzle independently
        run: python3 validate.py daily/2*.json

      # Option A (simplest): commit the files; serve them with GitHub Pages or the Django server.
      - name: Commit new puzzles
        run: |
          git config user.name "puzzle-bot"
          git config user.email "puzzle-bot@users.noreply.github.com"
          git add daily
          git diff --cached --quiet || git commit -m "Add daily puzzles"
          git push

      # Option B (scale): publish to S3 behind CloudFront. Add repo secrets AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY and a repo variable PUZZLE_BUCKET, then remove "if: false".
      - name: Publish to S3
        if: false
        run: |
          aws s3 sync daily "s3://${{ vars.PUZZLE_BUCKET }}/daily" \
            --exclude "index.json" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp daily/index.json "s3://${{ vars.PUZZLE_BUCKET }}/daily/index.json" \
            --cache-control "public,max-age=300"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
